<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP 주차 안내 - 현장 스캐너</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col justify-between select-none">

  <!-- 상단 네비게이션 -->
  <header class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-extrabold tracking-tight">🚗 VIP 주차 안내</h1>
    <a href="/admin.html" class="text-xs bg-blue-700 hover:bg-blue-600 text-white px-3 py-2 rounded-lg font-bold border border-blue-400">
      관리자 페이지
    </a>
  </header>

  <main class="p-4 flex-1 flex flex-col justify-start gap-4 max-w-md mx-auto w-full">

    <!-- 1. 스마트폰 카메라 뷰어 -->
    <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border-4 border-gray-800 aspect-[4/3] flex items-center justify-center">
      <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>

      <!-- OCR 가이드 라인 -->
      <div class="absolute border-2 border-yellow-400 border-dashed rounded-lg w-3/4 h-1/3 pointer-events-none flex items-center justify-center">
        <span class="text-yellow-300 text-xs font-bold bg-black/60 px-2 py-1 rounded">번호판을 이 박스 안에 맞추세요</span>
      </div>

      <!-- 로딩 인디케이터 -->
      <div id="ocrLoading" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white z-10">
        <svg class="animate-spin h-10 w-10 text-yellow-400 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="ocrStatusText" class="text-lg font-bold">번호판 분석 중...</span>
      </div>
    </div>

    <!-- 2. 스캔 버튼 -->
    <button id="scanBtn" class="w-full bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white font-black text-2xl py-5 rounded-2xl shadow-xl transition-transform active:scale-95 flex items-center justify-center gap-3">
      <span>📷 번호판 스캔하기</span>
    </button>

    <!-- 3. 수동 입력 보완 (야간/빛번짐 대비) -->
    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
      <label class="block text-sm font-bold text-gray-700 mb-2">인식이 안 될 경우 (차량 번호 뒤 4자리 검색)</label>
      <div class="flex gap-2">
        <input type="text" id="manualInput" placeholder="예: 4567 또는 123가4567" maxlength="10" class="flex-1 bg-gray-50 border-2 border-gray-300 rounded-lg px-4 py-3 text-lg font-bold text-center focus:outline-none focus:border-blue-600">
        <button id="manualBtn" class="bg-gray-800 hover:bg-black text-white font-bold px-5 py-3 rounded-lg text-lg min-w-[80px]">
          검색
        </button>
      </div>
    </div>

    <!-- 4. 결과 출력 Card / Modal -->
    <div id="resultCard" class="hidden bg-white rounded-2xl p-6 shadow-2xl border-4 transition-all">
      <div id="resultBadge" class="inline-block px-3 py-1 rounded-full text-sm font-extrabold mb-2"></div>
      <h2 id="resultTitle" class="text-3xl font-black mb-1"></h2>
      <p id="resultSubtitle" class="text-gray-600 font-bold mb-4"></p>

      <!-- 지정 주차 구역 (대형 폰트) -->
      <div id="zoneBox" class="rounded-xl p-4 text-center my-2 border-2">
        <div class="text-sm font-bold opacity-80 mb-1">지정 주차 구역</div>
        <div id="resultZone" class="text-5xl font-black tracking-wider"></div>
      </div>

      <p id="resultNote" class="text-sm text-gray-500 font-semibold mt-3 text-center"></p>

      <button onclick="hideResult()" class="w-full mt-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl">
        확인 / 다음 스캔
      </button>
    </div>

  </main>

  <!-- 캔버스 (카메라 프레임 캡처용 비보임) -->
  <canvas id="captureCanvas" class="hidden"></canvas>

  <script src="/app.js"></script>
</body>
</html>
